<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6f2" />
    <meta
      name="description"
      content="无疆卡首批报名。卡片免费领取，下单支付9.9元邮费，流量另行计费。"
    />
    <title>无疆卡 · 首批报名</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="./" aria-label="无疆卡首页"
          ><img src="favicon.svg" alt="" width="31" height="31" /><span
            >无疆<span class="brand-sub">5G 流站</span></span
          ></a
        >
        <span class="demo-tag">展示版</span>
        <button id="intro-button" class="text-button">卡片介绍</button>
      </header>
      <main id="app"></main>
      <footer class="demo-note">
        前端演示 · 登录为模拟，信息仅保存在此浏览器
      </footer>
    </div>
    <dialog id="intro-dialog" aria-labelledby="intro-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="intro-art" aria-hidden="true">
        <span class="art-ring"></span>
        <div class="little-card">
          <span class="little-w">W</span><b>无疆</b
          ><span class="little-chip"></span><small>5G 流站</small>
        </div>
      </div>
      <div class="intro-body">
        <span class="intro-batch">首批预计 2,000 张</span>
        <h1 id="intro-title">把流量，用得刚刚好。</h1>
        <p class="intro-description">
          按需消费，一份流量与家人共享。<br />适合日常上网、家庭共享和备用网络。
        </p>
        <div class="fee-summary">
          <div><span>卡片</span><strong>免费领取</strong></div>
          <span class="fee-plus">+</span>
          <div><span>下单邮费</span><strong>¥9.9</strong></div>
        </div>
        <p class="intro-terms">
          流量费用另计，不适合频繁测速和持续大流量下载。<br />所有人可报名，Ultra
          用户、灯牌等级优先参考。
        </p>
        <button class="primary-button" id="intro-continue">
          知道了，去报名 <span>↗</span>
        </button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
